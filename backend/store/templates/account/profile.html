{% extends "base.html" %}

{% block title %}My Profile | MOOMEEN PRODUCTS{% endblock %}

{% block content %}

<style>
    .account-page {
        max-width: 1100px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .account-header {
        margin-bottom: 30px;
    }

    .account-header h1 {
        color: #1D4D32;
        font-family: "Cormorant Garamond", serif;
        font-size: 42px;
        margin-bottom: 5px;
    }

    .account-header p {
        color: #666;
    }

    .profile-card {
        background: #fff;
        border: 1px solid #e8e8e8;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    .profile-icon {
        width: 85px;
        height: 85px;
        border-radius: 50%;
        background: #e8f3ef;
        color: #1D4D32;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .profile-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .profile-field label {
        display: block;
        font-size: 14px;
        color: #777;
        margin-bottom: 7px;
    }

    .profile-field input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #ddd;
        border-radius: 9px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .profile-field input:focus {
        outline: none;
        border-color: #168B82;
    }

    .save-btn {
        background: #168B82;
        color: white;
        border: none;
        padding: 13px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }

    .save-btn:hover {
        background: #126f68;
    }

    @media(max-width: 700px) {
        .profile-row {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="account-page">

    <div class="account-header">
        <h1>My Profile</h1>
        <p>Manage your personal information.</p>
    </div>

    <div class="profile-card">

        <div class="profile-icon">
            {{ user.first_name|default:user.username|first|upper }}
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="profile-row">

                <div class="profile-field">
                    <label>First Name</label>
                    <input
                        type="text"
                        name="first_name"
                        value="{{ user.first_name }}"
                    >
                </div>

                <div class="profile-field">
                    <label>Last Name</label>
                    <input
                        type="text"
                        name="last_name"
                        value="{{ user.last_name }}"
                    >
                </div>

            </div>

            <div class="profile-row">

                <div class="profile-field">
                    <label>Username</label>
                    <input
                        type="text"
                        value="{{ user.username }}"
                        readonly
                    >
                </div>

                <div class="profile-field">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        value="{{ user.email }}"
                    >
                </div>

            </div>

            <button type="submit" class="save-btn">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
