# =========================================================
# Google Cloud Build Pipeline for MOOMEEN PRODUCTS
# Automatically builds container & deploys to Cloud Run
# =========================================================

steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/moomeen-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/moomeen-backend:latest'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/moomeen-backend:$COMMIT_SHA'

  # 3. Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'moomeen-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/moomeen-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/moomeen-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/moomeen-backend:latest'
